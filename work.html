<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Selected work — Allison Qiu">
  <title>Work · Allison Qiu</title>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <main class="work" aria-label="My Work">
    <!-- Figma frame Work · 9:26 · 1512×1524 · 2× export -->
    <img
      class="work__art"
      src="assets/work-page.png?v=mailto1"
      alt="My Work — NABU and Brilliant Cities projects"
      width="3024"
      height="3048"
    >

    <!-- Project cards · Frame 3 (NABU) + brilliant cities — slight scale on hover -->
    <a
      class="work-card work-card--nabu"
      href="projects/nabu.html"
      aria-label="NABU — Spring 2025"
    >
      <img src="assets/work-card-nabu.png?v=hover-fix2" alt="" width="2190" height="614" aria-hidden="true">
    </a>
    <a
      class="work-card work-card--brilliant"
      href="projects/brilliant-cities.html"
      aria-label="Brilliant Cities — Fall 2024"
    >
      <img src="assets/work-card-brilliant.png?v=nocream2" alt="" width="2190" height="618" aria-hidden="true">
    </a>

    <!-- Tabs — exact Figma px; same hover lift/scale as home -->
    <nav class="work-hotspots" aria-label="Primary">
      <a
        class="work-hotspot work-hotspot--tab work-hotspot--home"
        href="/"
        aria-label="Home"
      >
        <img src="assets/work-nav-home.png?v=figmashadow1" alt="" width="296" height="192" aria-hidden="true">
      </a>
      <a
        class="work-hotspot work-hotspot--tab work-hotspot--about"
        href="about.html"
        aria-label="About me"
      >
        <img src="assets/work-nav-about.png?v=figmafix10" alt="" width="349" height="138" aria-hidden="true">
      </a>
    </nav>

    <a
      class="work-hotspot work-hotspot--stamp work-hotspot--linkedin"
      href="https://www.linkedin.com/in/allisonqiu/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="LinkedIn"
    >
      <img src="assets/stamp-linkedin.png?v=mailto1" alt="" width="292" height="316" aria-hidden="true">
    </a>
    <a
      class="work-hotspot work-hotspot--stamp work-hotspot--email"
      href="mailto:allisonqiu10@gmail.com"
      aria-label="Email allisonqiu10@gmail.com"
    >
      <img src="assets/stamp-email.png?v=mailto1" alt="" width="290" height="316" aria-hidden="true">
      <span class="visually-hidden">allisonqiu10@gmail.com</span>
    </a>
  </main>
  <script src="scripts/custom-cursor.js"></script>
  <script src="scripts/mailto.js"></script>
</body>
</html>
